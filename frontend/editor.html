<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0"
    />
    <title>my-mind</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <div id="app">
      <div id="bar">
        <button id="close-btn">Close</button>
        <span class="spacer"></span>
        <button id="toggle-btn">Edit</button>
      </div>

      <div id="edit-pane" class="hidden">
        <textarea id="editor"></textarea>
      </div>
      <div id="view-pane"></div>
    </div>

    <script type="module">
      import EasyMDE from "easymde";
      import "easymde/dist/easymde.min.css";

      function sendMessage(action, value) {
        window.parent.postMessage({ action, value }, "*");
      }

      var mode = "edit";
      var currentContent = "";
      var renderMarkdown = null;

      var easyMDE = new EasyMDE({
        element: document.getElementById("editor"),
        autosave: { enabled: false },
        spellChecker: false,
        status: false,
        toolbar: [
          "bold",
          "italic",
          "strikethrough",
          "|",
          "heading-1",
          "heading-2",
          "heading-3",
          "|",
          "quote",
          "unordered-list",
          "ordered-list",
          "code",
          "|",
          "link",
          "image",
          "table",
          "horizontal-rule",
        ],
      });

      document.getElementById("view-pane").classList.add("hidden");
      document.getElementById("edit-pane").classList.remove("hidden");
      document.getElementById("toggle-btn").textContent = "View";

      renderMarkdown = function (md) {
        return easyMDE.options.previewRender(md);
      };

      easyMDE.codemirror.on("change", function () {
        currentContent = easyMDE.value();
        sendMessage("setContent", currentContent);
      });

      function updateViewPane() {
        document.getElementById("view-pane").innerHTML = renderMarkdown
          ? renderMarkdown(currentContent || "")
          : currentContent || "";
      }

      function toggleMode() {
        if (mode === "view") {
          mode = "edit";
          document.getElementById("view-pane").classList.add("hidden");
          document.getElementById("edit-pane").classList.remove("hidden");
          document.getElementById("toggle-btn").textContent = "View";
          if (easyMDE.value() !== currentContent) easyMDE.value(currentContent);
          easyMDE.codemirror.refresh();
        } else {
          mode = "view";
          document.getElementById("edit-pane").classList.add("hidden");
          document.getElementById("view-pane").classList.remove("hidden");
          document.getElementById("toggle-btn").textContent = "Edit";
          currentContent = easyMDE.value();
          updateViewPane();
        }
      }

      document
        .getElementById("close-btn")
        .addEventListener("click", () => sendMessage("closeEditor", true));
      document
        .getElementById("toggle-btn")
        .addEventListener("click", () => toggleMode());

      window.addEventListener("message", function (e) {
        if (!e.data || !e.data.action) return;

        if (e.data.action === "setContent") {
          currentContent = e.data.value || "";
          if (mode === "edit" && easyMDE.value() !== currentContent)
            easyMDE.value(currentContent);
          updateViewPane();
        }
        if (e.data.action === "getContent")
          sendMessage("setContent", currentContent);
        if (e.data.action === "renderMarkdown")
          sendMessage("renderedMarkdown", renderMarkdown(e.data.value));
      });

      window.addEventListener("load", function () {
        setTimeout(function () {
          sendMessage("getContent", null);
        }, 100);
      });
    </script>
  </body>
</html>
