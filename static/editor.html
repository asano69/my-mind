<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="https://unpkg.com/vditor/dist/index.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }
        #editor {
            height: 100vh;
        }
        /* ツールバーを小さく */
        .vditor-toolbar {
            padding: 2px 4px !important;
        }
        .vditor-toolbar__item button {
            height: 26px !important;
            width: 26px !important;
        }
    </style>
</head>
<body>
    <div id="editor"></div>
    <script src="https://unpkg.com/vditor/dist/index.min.js"></script>
    <script>
        function sendMessage(action, value) {
            window.parent.postMessage({ action: action, value: value }, '*');
        }

        var vditor = new Vditor('editor', {
            height: window.innerHeight,
            mode: 'wysiwyg',
            theme: 'classic',
            toolbar: [
                'headings', 'bold', 'italic', 'strike', '|',
                'line', 'quote', 'list', 'ordered-list', 'code', 'inline-code', '|',
                'link', 'upload', 'table', '|',
                {
                    name: 'close',
                    tip: 'ノートを閉じる',
                    icon: '<svg viewBox="0 0 16 16" width="16" height="16"><path d="M2 2l12 12M14 2L2 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
                    click: function() { sendMessage('closeEditor', true); }
                }
            ],
            toolbarConfig: { pin: true },
            cache: { enable: false },
            preview: {
                markdown: {
                    toc: false,
                    autoSpace: false,
                }
            },
            after: function() {
                // 親からの初期コンテンツ受信に備えて準備完了を通知
                sendMessage('editorReady', true);
            },
            input: function(value) {
                sendMessage('setContent', value);
            }
        });

        window.addEventListener('message', function(e) {
            if (!e.data || !e.data.action) { return; }
            switch (e.data.action) {
                case 'setContent':
                    var val = e.data.value || '';
                    if (vditor.getValue() !== val) {
                        vditor.setValue(val);
                    }
                    break;
                case 'getContent':
                    sendMessage('setContent', vditor.getValue());
                    break;
            }
        });

        window.addEventListener('resize', function() {
            vditor.destroy();
        });
    </script>
</body>
</html>
