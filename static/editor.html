<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="easymde.min.css">
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 18px;
            background: #f5ede4;
        }
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #f5ede4;
        }

        /* ツールバー — app.css の .pane#io button と同じ設計 */
        #bar {
            flex: none;
            display: flex;
            align-items: center;
            background: #ede0d4;
            border-bottom: 1px solid #d9c9bb;
            padding: 4px 10px;
            gap: 4px;
        }
        #bar button {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-family: "TeX Gyre Termes", "Nimbus Roman No9 L", "Times New Roman", "Times", serif;
            padding: 4px 10px;
            opacity: 0.6;
            border-radius: 3px;
            color: #5a4a3a;
            transition: opacity 80ms ease, background-color 80ms ease;
        }
        #bar button:hover {
            opacity: 1;
            background: #d9c9bb;
        }
        /* View/Edit トグルは主アクションなので少し強調 */
        #bar #toggle-btn {
            opacity: 0.85;
            font-weight: bold;
        }
        #bar .spacer { margin-left: auto; }

        /* ビューペイン */
        #view-pane {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            /* Serif font — matches #note-preview-inner in app.css */
            font-family: "TeX Gyre Termes", "Nimbus Roman No9 L", "Times New Roman", "Times", serif;
            font-size: 18px;
            line-height: 1.8;
            background: #f5ede4;
            color: #3a2e24;
        }
        #view-pane a { color: #7a5c3e; text-decoration: underline; }
        #view-pane img { max-width: 100%; height: auto; display: block; margin: 0.5em 0; }
        #view-pane pre { background: #ede0d4; border-radius: 4px; padding: 0.8em 1em; overflow-x: auto; font-size: 15px; }
        #view-pane code { font-family: "Menlo","Consolas",monospace; font-size: 15px; }
        #view-pane blockquote { border-left: 4px solid #d9c9bb; margin: 0; padding-left: 1em; color: #7a6a5a; }
        #view-pane table { border-collapse: collapse; width: 100%; }
        #view-pane table th, #view-pane table td { border: 1px solid #d9c9bb; padding: 0.5em 0.9em; }
        #view-pane table th { background: #ede0d4; }
        #view-pane h1 { font-size: 1.8em; }
        #view-pane h2 { font-size: 1.4em; }
        #view-pane h3 { font-size: 1.2em; }

        /* 編集ペイン */
        #edit-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .EasyMDEContainer { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        .editor-toolbar {
            flex: none;
            background: #ede0d4 !important;
            border-bottom: 1px solid #d9c9bb !important;
        }
        .editor-toolbar button { color: #5a4a3a !important; }
        .editor-toolbar button:hover { background: #d9c9bb !important; }
        .editor-toolbar i.separator { border-left-color: #d9c9bb !important; }
        .CodeMirror {
            flex: 1;
            height: auto;
            font-family: "Menlo","Consolas","Monaco",monospace;
            font-size: 18px !important;
            line-height: 1.8 !important;
            background: #f5ede4 !important;
            color: #3a2e24 !important;
        }
        .CodeMirror-cursor { border-left-color: #5a4a3a !important; }
        .CodeMirror-selected { background: #d9c9bb !important; }

        .hidden { display: none !important; }
        .fa-close::before { content: "x"; font-style: normal; }
    </style>
</head>
<body>
<div id="app">
    <div id="bar">
        <button onclick="sendMessage('closeEditor', true)">Close</button>
        <span class="spacer"></span>
        <button id="toggle-btn" onclick="toggleMode()">Edit</button>
    </div>

    <div id="edit-pane" class="hidden">
        <textarea id="editor"></textarea>
    </div>
    <div id="view-pane"></div>
</div>

<script src="easymde.min.js"></script>
<script>
    function sendMessage(action, value) {
        window.parent.postMessage({ action: action, value: value }, '*');
    }

    var mode = 'edit';
    var currentContent = '';
    var renderMarkdown = null;

    var easyMDE = new EasyMDE({
        element: document.getElementById('editor'),
        autosave: { enabled: false },
        spellChecker: false,
        status: false,
        toolbar: [
            'bold', 'italic', 'strikethrough', '|',
            'heading-1', 'heading-2', 'heading-3', '|',
            'quote', 'unordered-list', 'ordered-list', 'code', '|',
            'link', 'image', 'table', 'horizontal-rule'
        ]
    });
    document.getElementById('view-pane').classList.add('hidden');
    document.getElementById('edit-pane').classList.remove('hidden');
    document.getElementById('toggle-btn').textContent = 'View';

    renderMarkdown = function(md) {
        return easyMDE.options.previewRender(md);
    };

    easyMDE.codemirror.on('change', function() {
        currentContent = easyMDE.value();
        sendMessage('setContent', currentContent);
    });

    function updateViewPane() {
        var html = renderMarkdown ? renderMarkdown(currentContent || '') : (currentContent || '');
        document.getElementById('view-pane').innerHTML = html;
    }

    function toggleMode() {
        if (mode === 'view') {
            mode = 'edit';
            document.getElementById('view-pane').classList.add('hidden');
            document.getElementById('edit-pane').classList.remove('hidden');
            document.getElementById('toggle-btn').textContent = 'View';
            if (easyMDE.value() !== currentContent) {
                easyMDE.value(currentContent);
            }
            easyMDE.codemirror.refresh();
        } else {
            mode = 'view';
            document.getElementById('edit-pane').classList.add('hidden');
            document.getElementById('view-pane').classList.remove('hidden');
            document.getElementById('toggle-btn').textContent = 'Edit';
            currentContent = easyMDE.value();
            updateViewPane();
        }
    }

    window.addEventListener('message', function(e) {
        if (!e.data || !e.data.action) { return; }

        if (e.data.action === 'setContent') {
            currentContent = e.data.value || '';
            if (mode === 'edit' && easyMDE.value() !== currentContent) {
                easyMDE.value(currentContent);
            }
            updateViewPane();
        }

        if (e.data.action === 'getContent') {
            sendMessage('setContent', currentContent);
        }

        if (e.data.action === 'renderMarkdown') {
            sendMessage('renderedMarkdown', renderMarkdown(e.data.value));
        }
    });

    window.addEventListener('load', function() {
        setTimeout(function() {
            sendMessage('getContent', null);
        }, 100);
    });
</script>
</body>
</html>
