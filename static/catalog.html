{{template "base" .PageMeta}}
{{define "head-extra"}}
  <link rel="stylesheet" href="catalog.css">
  <style>
    /* ── Confirm overlay (mirrors file-switcher style) ── */
    #confirm-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 9999;
      align-items: flex-start;
      justify-content: center;
      padding-top: 12vh;
    }
    #confirm-backdrop.open {
      display: flex;
    }
    #confirm-box {
      background: var(--color-pane);
      border: 1px solid rgba(44,32,21,.2);
      border-radius: 6px;
      width: min(480px, 90vw);
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #confirm-title {
      padding: 12px 14px 8px;
      font-size: 13px;
      font-family: var(--font-sans);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      opacity: .55;
      border-bottom: 1px solid rgba(44,32,21,.1);
    }

		#confirm-list {
		  list-style: none;
		  margin: 0;
		  padding: 4px 0;
		  max-height: 320px;
		  overflow-y: auto;
		}

		#confirm-list li {
		  padding: 8px 14px;
		  font-size: 15px;
		  font-family: var(--font-sans);
		}

    #confirm-list .diff-delete { color: #922b21; }
    #confirm-list .diff-rename { color: var(--color-text); opacity: .8; }
    #confirm-actions {
      display: flex;
      border-top: 1px solid rgba(44,32,21,.1);
    }
    #confirm-actions button {
      flex: 1;
      padding: 10px 8px;
      border: none;
      border-radius: 0;
      font-size: 15px;
      font-family: var(--font-sans);
      cursor: pointer;
      background: transparent;
      color: var(--color-text);
      opacity: .55;
      transition: opacity 80ms, background-color 80ms;
    }
    #confirm-actions button:hover,
    #confirm-actions button.focused {
      opacity: 1;
      background: var(--color-hover);
    }
    #confirm-ok {
      color: #922b21;
      border-left: 1px solid rgba(44,32,21,.1);
    }
    #confirm-ok.focused {
      background: rgba(192,57,43,.1);
    }
  </style>
{{end}}
<body>
  <a href="/" target="_self" class="catalog-link">
    <img src="img/catalog-open.png" alt="Catalog">
  </a>
  <main>
    <div class="header">
      <h1>Index</h1>
      {{if .Maps}}<button class="mode-btn" id="modeToggle">Edit</button>{{end}}
    </div>

    {{if .Maps}}
    <div class="search-wrap">
      <input type="search" id="search" placeholder="filter..." autofocus>
    </div>

    <!-- batch commit bar (visible in edit mode only) -->
    <div class="commit-bar">
      <button class="commit-btn cancel" id="cancelBtn">Cancel</button>
      <button class="commit-btn apply"  id="applyBtn">Apply</button>
    </div>

    <ul id="list">
      {{range .Maps}}
      <li data-name="{{.Name}}" data-orig="{{.Name}}">
        <!-- view mode -->
        <a class="view-row" href="{{.URL}}">
          <span class="name">{{.Name}}</span>
          <span class="date" data-modtime="{{.ModTime.Unix}}"></span>
        </a>
        <!-- edit mode -->
        <div class="edit-row">
          <input type="checkbox" class="del-check" title="Mark for deletion">
          <input type="text" class="rename-input" value="{{.Name}}" spellcheck="false">
          <span class="edit-date" data-modtime="{{.ModTime.Unix}}"></span>
        </div>
      </li>
      {{end}}
    </ul>

    <div class="result-msg" id="resultMsg"></div>

    {{else}}
    <p class="empty">no maps found.</p>
    {{end}}
  </main>

  <!-- diff confirm overlay -->
  <div id="confirm-backdrop" role="dialog" aria-modal="true">
    <div id="confirm-box">
      <div id="confirm-title">Confirm changes</div>
      <ul id="confirm-list"></ul>
      <div id="confirm-actions">
        <button id="confirm-cancel">Cancel</button>
        <button id="confirm-ok">Apply</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { showToast } from '/toast.js';

    /* ===== Elements ===== */
    const body            = document.body;
    const modeToggle      = document.getElementById('modeToggle');
    const search          = document.getElementById('search');
    const list            = document.getElementById('list');
    const applyBtn        = document.getElementById('applyBtn');
    const cancelBtn       = document.getElementById('cancelBtn');
    const resultMsg       = document.getElementById('resultMsg');
    const confirmBackdrop = document.getElementById('confirm-backdrop');
    const confirmList     = document.getElementById('confirm-list');
    const confirmCancel   = document.getElementById('confirm-cancel');
    const confirmOk       = document.getElementById('confirm-ok');

    /* ===== Mode toggle ===== */
    function enterEditMode() {
      body.classList.add('edit-mode');
      if (modeToggle) modeToggle.textContent = 'Browse';
      hideResult();
    }
    function leaveEditMode() {
      body.classList.remove('edit-mode');
      if (modeToggle) modeToggle.textContent = 'Edit';
      resetEdits();
    }
    function resetEdits() {
      if (!list) return;
      list.querySelectorAll('li').forEach(li => {
        li.classList.remove('pending-delete');
        const cb    = li.querySelector('.del-check');
        const input = li.querySelector('.rename-input');
        if (cb)    cb.checked = false;
        if (input) { input.value = li.dataset.orig; input.classList.remove('dirty'); }
      });
      hideResult();
    }

    if (modeToggle) {
      modeToggle.addEventListener('click', () => {
        body.classList.contains('edit-mode') ? leaveEditMode() : enterEditMode();
      });
    }
    if (cancelBtn) cancelBtn.addEventListener('click', leaveEditMode);
    if (applyBtn)  applyBtn.addEventListener('click', openConfirmOverlay);

    /* ===== Delete mark ===== */
    if (list) {
      list.addEventListener('change', (e) => {
        if (!e.target.classList.contains('del-check')) return;
        e.target.closest('li').classList.toggle('pending-delete', e.target.checked);
      });

      list.addEventListener('input', (e) => {
        if (!e.target.classList.contains('rename-input')) return;
        const li = e.target.closest('li');
        e.target.classList.toggle('dirty', e.target.value.trim() !== li.dataset.orig);
      });
    }

    /* ===== Collect pending changes ===== */
    function collectChanges() {
      const toDelete = [];
      const toRename = [];
      if (!list) return { toDelete, toRename };

      list.querySelectorAll('li:not([hidden])').forEach(li => {
        const cb    = li.querySelector('.del-check');
        const input = li.querySelector('.rename-input');
        const orig  = li.dataset.orig;

        if (cb && cb.checked) {
          toDelete.push({ li, orig });
        } else if (input) {
          const newName = input.value.trim();
          if (newName && newName !== orig) toRename.push({ li, orig, newName });
        }
      });

      return { toDelete, toRename };
    }

    /* ===== Confirm overlay ===== */

    // 0 = Cancel focused, 1 = Apply focused
    let focusedBtn = 1;

    function setFocus(idx) {
      focusedBtn = idx;
      confirmCancel.classList.toggle('focused', idx === 0);
      confirmOk.classList.toggle('focused',     idx === 1);
    }

    function openConfirmOverlay() {
      const { toDelete, toRename } = collectChanges();
      if (toDelete.length === 0 && toRename.length === 0) { leaveEditMode(); return; }

      // Build diff list
      confirmList.innerHTML = '';
      toDelete.forEach(({ orig }) => {
        const li = document.createElement('li');
        li.className = 'diff-delete';
        li.textContent = `Delete  "${orig}"`;
        confirmList.appendChild(li);
      });
      toRename.forEach(({ orig, newName }) => {
        const li = document.createElement('li');
        li.className = 'diff-rename';
        li.textContent = `Rename  "${orig}"  →  "${newName}"`;
        confirmList.appendChild(li);
      });

      setFocus(1); // default: Apply
      confirmBackdrop.classList.add('open');
    }

    function closeConfirmOverlay() {
      confirmBackdrop.classList.remove('open');
    }

    // Close on backdrop click (outside the box)
    confirmBackdrop.addEventListener('click', (e) => {
      if (e.target === confirmBackdrop) closeConfirmOverlay();
    });

    if (confirmCancel) confirmCancel.addEventListener('click', closeConfirmOverlay);
    if (confirmOk)     confirmOk.addEventListener('click', runCommit);

    /* ===== Batch commit (runs after overlay confirmation) ===== */
    async function runCommit() {
      closeConfirmOverlay();

      const { toDelete, toRename } = collectChanges();
      if (toDelete.length === 0 && toRename.length === 0) { leaveEditMode(); return; }

      if (applyBtn) applyBtn.disabled = true;
      hideResult();

      const errors = [];

      /* -- delete -- */
      for (const { li, orig } of toDelete) {
        try {
          const res = await fetch(`/maps/${encodeURIComponent(orig)}.mymind`, { method: 'DELETE' });
          if (res.ok) { li.remove(); }
          else { errors.push(`Delete failed: "${orig}" (${res.status})`); }
        } catch { errors.push(`Delete error: "${orig}"`); }
      }

      /* -- rename -- */
      for (const { li, orig, newName } of toRename) {
        try {
          const res = await fetch(`/maps/${encodeURIComponent(orig)}.mymind`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'text/plain' },
            body: newName,
          });
          if (res.ok) {
            li.dataset.name = newName;
            li.dataset.orig = newName;
            const viewName = li.querySelector('.view-row .name');
            const viewLink = li.querySelector('.view-row');
            const input    = li.querySelector('.rename-input');
            if (viewName) viewName.textContent = newName;
            if (viewLink) viewLink.href = `/m/${encodeURIComponent(newName)}.mymind`;
            if (input)    { input.value = newName; input.classList.remove('dirty'); }
          } else if (res.status === 409) {
            errors.push(`Rename failed: "${orig}" → "${newName}" (name already exists)`);
          } else {
            errors.push(`Rename failed: "${orig}" → "${newName}" (${res.status})`);
          }
        } catch { errors.push(`Rename error: "${orig}"`); }
      }

      if (applyBtn) applyBtn.disabled = false;

      if (list && list.querySelectorAll('li').length === 0) {
        list.insertAdjacentHTML('afterend', '<p class="empty">no maps found.</p>');
        list.remove();
      }
      if (errors.length > 0) { showResult('error', errors.join('\n')); }
      else {
        const parts = [];
        if (toDelete.length) parts.push(`${toDelete.length} deleted`);
        if (toRename.length) parts.push(`${toRename.length} renamed`);
        showToast("Done", parts.join(', '));
        leaveEditMode();
      }
    }

    /* ===== Global keyboard handler ===== */
    document.addEventListener('keydown', (e) => {
      const overlayOpen = confirmBackdrop.classList.contains('open');

      if (overlayOpen) {
        switch (e.key) {
          case 'ArrowLeft':
          case 'ArrowRight':
            e.preventDefault();
            setFocus(focusedBtn === 0 ? 1 : 0);
            break;
          case 'Enter':
            e.preventDefault();
            if (focusedBtn === 1) runCommit(); else closeConfirmOverlay();
            break;
          case 'Escape':
            e.preventDefault();
            closeConfirmOverlay();
            break;
        }
        return; // swallow all other keys while overlay is open
      }

      /* -- edit mode: Enter opens confirm overlay -- */
      if (body.classList.contains('edit-mode')) {
        if (e.key === 'Enter') {
          e.preventDefault();
          openConfirmOverlay();
        }
        return;
      }

      /* -- view mode: arrow / enter navigation -- */
      if (!list) return;
      const links   = visibleLinks();
      const current = document.activeElement;
      const idx     = links.indexOf(current);
      if (idx === -1) return;
      switch (e.key) {
        case 'ArrowDown':  e.preventDefault(); if (idx + 1 < links.length) links[idx + 1].focus(); break;
        case 'ArrowUp':    e.preventDefault(); if (idx > 0) links[idx - 1].focus(); else search && search.focus(); break;
        case 'Enter':      e.preventDefault(); current.click(); break;
        case 'Escape':     search && (search.focus(), search.select()); break;
      }
    });

    function showResult(type, msg) {
      if (!resultMsg) return;
      resultMsg.className = `result-msg ${type}`;
      resultMsg.textContent = msg;
    }
    function hideResult() {
      if (!resultMsg) return;
      resultMsg.className = 'result-msg';
      resultMsg.textContent = '';
    }

    /* ===== Search filter (view mode only) ===== */
    function visibleLinks() {
      return Array.from(list ? list.querySelectorAll('li:not([hidden]) .view-row') : []);
    }

    if (search) {
      search.addEventListener('input', () => {
        const q = search.value.toLowerCase();
        list && list.querySelectorAll('li').forEach(li => {
          li.hidden = !li.dataset.name.toLowerCase().includes(q);
        });
      });
      search.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          const links = visibleLinks();
          if (links.length) links[0].focus();
        }
      });
    }

    /* ===== Date formatting ===== */
    document.querySelectorAll('[data-modtime]').forEach(el => {
      const d   = new Date(parseInt(el.dataset.modtime, 10) * 1000);
      const pad = n => String(n).padStart(2, '0');
      const yy  = String(d.getFullYear()).slice(2);
      el.textContent = `${yy}${pad(d.getMonth()+1)}${pad(d.getDate())}.${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
    });
  </script>
</body>
</html>
